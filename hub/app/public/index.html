<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Turntail</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta property="og:title" content="Turntail">
<meta property="og:description" content="Vinyl radio for a group of friends on Tailscale.">
<meta property="og:type" content="website">
<meta property="og:image" content="/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/og.jpg">
<style>
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/fonts/inter-latin-wght-normal.woff2) format('woff2-variations'); }
@font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/fonts/inter-tight-latin-wght-normal.woff2) format('woff2-variations'); }
@font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 100 800; font-display: swap; src: url(/fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2-variations'); }

:root {
  --bg: #0f0b0d;
  --surface: #1a1315;
  --surface-2: #231a1d;
  --t1: #f5f0ec; --t2: #cfc4bd; --t3: #92857f;
  --border: rgba(255,255,255,0.08);
  --ember: #ff6b3d; --amber: #f5a623; --gold: #ffd166; --rose: #ff6b9d; --plum: #b0577a;
  --live: #2dd4bf;
  --grad-ember: linear-gradient(120deg, #ff6b9d 0%, #ff6b3d 45%, #f5a623 80%, #ffd166 100%);
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --disp: 'Inter Tight', 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --c: var(--ember);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { color-scheme: dark; }
body {
  color: var(--t1); font-family: var(--sans); font-size: 16px; line-height: 1.6;
  min-height: 100vh; padding: 1.25rem 1.1rem 9rem;
  background:
    radial-gradient(1100px 720px at 90% -12%, rgba(255,107,61,0.16), transparent 62%),
    radial-gradient(900px 620px at 0% 0%, rgba(255,107,157,0.12), transparent 60%),
    radial-gradient(900px 700px at 100% 55%, rgba(245,166,35,0.08), transparent 60%),
    radial-gradient(800px 640px at -10% 80%, rgba(176,87,122,0.09), transparent 58%),
    var(--bg);
  background-attachment: fixed; background-size: 100vw 100vh; background-repeat: no-repeat;
}
.wrap { max-width: 640px; margin: 0 auto; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
h1 { font-family: var(--disp); font-weight: 700; font-size: clamp(2rem, 7vw, 2.8rem); letter-spacing: -0.015em; line-height: 1;
     background: var(--grad-ember); -webkit-background-clip: text; background-clip: text; color: transparent; }
.eyebrow { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--t3); }
.me { font-family: var(--mono); font-size: 0.7rem; color: var(--t3); text-align: right; }
.me b { color: var(--t2); font-weight: 600; }

.card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 17px; padding: 1.1rem 1.15rem; margin-bottom: 0.9rem;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 26px 56px -46px color-mix(in srgb, var(--c) 34%, transparent); overflow: hidden; }
.card::before { content: ""; position: absolute; inset: -40% auto auto -20%; width: 60%; height: 90%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 12%, transparent), transparent); pointer-events: none; }
.card > * { position: relative; }
.label { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--t3); display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
.dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--t3); }
.dot.on { background: var(--live); box-shadow: 0 0 14px var(--live); animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }

/* hero: the record */
.hero { --c: var(--ember); display: grid; grid-template-columns: 132px 1fr; gap: 1.1rem; align-items: center; }
.hero.on { --c: var(--live); }
.hero.house { --c: var(--amber); }
.house .disc { animation: spin 4s linear infinite; }
.disc { width: 132px; height: 132px; border-radius: 50%; position: relative; flex: none;
  background: repeating-radial-gradient(circle at 50% 50%, #17100f 0 1.6px, #221a1a 1.6px 3.2px);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 0 40px -6px color-mix(in srgb, var(--c) 40%, transparent), inset 0 0 30px rgba(0,0,0,0.6); }
.disc::before { content: ""; position: absolute; inset: 39%; border-radius: 50%; background: var(--grad-ember); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); }
.disc::after { content: ""; position: absolute; inset: 47%; border-radius: 50%; background: var(--bg); }
.disc .sheen { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 20deg, transparent 0 60deg, rgba(255,255,255,0.05) 90deg, transparent 120deg 240deg, rgba(255,255,255,0.04) 270deg, transparent 300deg); }
.on .disc { animation: spin 1.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hero > div { min-width: 0; }
.hero .big { font-family: var(--disp); font-size: 1.55rem; font-weight: 680; letter-spacing: -0.01em; line-height: 1.15; }
.hero .now { color: var(--t2); margin-top: 0.15rem; min-height: 1.4em; }
.hero .cover { width: 3.6rem; height: 3.6rem; border-radius: 6px; object-fit: cover; margin-top: 0.4rem; box-shadow: 0 8px 20px -10px #000, 0 0 0 1px var(--border); }
.hero .clock { font-family: var(--mono); font-size: 0.7rem; color: var(--t3); margin-top: 0.3rem; }
.playrow { display: flex; align-items: center; gap: 0.8rem; margin-top: 0.9rem; }
.play { width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 0; cursor: pointer; background: var(--grad-ember); color: #2a0f06; font-size: 1.15rem; font-weight: 800;
        box-shadow: 0 0 24px -4px color-mix(in srgb, var(--ember) 60%, transparent); display: grid; place-items: center; transition: transform 0.15s; }
.play:hover { transform: scale(1.05); } .play:disabled { opacity: 0.35; cursor: default; transform: none; box-shadow: none; }
.play.waiting { opacity: 0.75; }
.play.nudge { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: scale(1.08); box-shadow: 0 0 34px -2px color-mix(in srgb, var(--ember) 80%, transparent); } }
.play.playing { background: var(--live); box-shadow: 0 0 24px -4px color-mix(in srgb, var(--live) 70%, transparent); color: #052b26; }
.volwrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem; }
.vol { min-width: 0; }
.vol { flex: 1; accent-color: var(--ember); }
.volico { font-size: 0.95rem; opacity: 0.8; }
.volval { font-family: var(--mono); font-size: 0.66rem; color: var(--t3); min-width: 2.6rem; text-align: right; }
audio { display: none; }
.err { font-family: var(--mono); font-size: 0.7rem; color: var(--rose); margin-top: 0.4rem; min-height: 1.1em; }

/* stations */
.stations { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.st { --c: var(--amber); display: flex; gap: 0.1rem; padding: 0.55rem 0.8rem; border-radius: 11px; background: var(--surface-2); border: 1px solid color-mix(in srgb, var(--c) 28%, transparent); min-width: 8rem; }
.st.on { --c: var(--live); box-shadow: 0 0 18px -6px var(--live); }
.st.src { --c: var(--gold); }
.st.sel { outline: 1px solid color-mix(in srgb, var(--rose) 60%, transparent); outline-offset: 2px; }
.st { flex-direction: row; align-items: center; gap: 0.6rem; }
.st .stav { width: 2rem; height: 2rem; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 50%, transparent); }
.st .n { font-weight: 640; font-size: 0.95rem; }
.st .s { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--c) 80%, var(--t3)); }
.queue { list-style: none; margin-top: 0.7rem; }
.queue li { display: flex; gap: 0.6rem; align-items: baseline; padding: 0.25rem 0; color: var(--t2); }
.queue li:not(.muted)::before { content: counter(q); counter-increment: q; font-family: var(--mono); font-size: 0.7rem; color: var(--amber); min-width: 1.2rem; }
.queue { counter-reset: q; }
.muted { color: var(--t3); font-size: 0.9rem; }

/* station and admin cards */
.station { --c: var(--rose); } .admin { --c: var(--amber); }
.station.onair { --c: var(--live); box-shadow: 0 0 0 1px color-mix(in srgb, var(--live) 45%, transparent), 0 0 40px -12px var(--live); }
.station.onair .label { color: var(--live); }
.slot { font-family: var(--mono); font-size: 0.72rem; color: var(--t2); margin-top: 0.6rem; min-height: 1.1em; }
.station.onair .slot { color: var(--live); }
@keyframes flash { 0% { box-shadow: 0 0 0 4px var(--live), 0 0 60px var(--live); } 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--live) 45%, transparent), 0 0 40px -12px var(--live); } }
.station.justlive { animation: flash 1.2s ease-out 3; }
.row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 0.5rem; }
button.b { font: inherit; font-size: 0.9rem; font-weight: 600; padding: 0.55rem 0.95rem; border-radius: 10px; cursor: pointer; background: var(--surface-2); color: var(--t1); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); transition: transform 0.12s, box-shadow 0.12s; }
button.b:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -14px var(--c); }
button.b.primary { background: color-mix(in srgb, var(--c) 22%, var(--surface-2)); border-color: color-mix(in srgb, var(--c) 60%, transparent); }
button.b:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
input[type=text] { font: inherit; font-size: 0.9rem; flex: 1; min-width: 12rem; background: var(--bg); color: var(--t1); border: 1px solid var(--border); border-radius: 10px; padding: 0.5rem 0.7rem; }
input[type=text]:focus { outline: none; border-color: color-mix(in srgb, var(--c) 55%, transparent); }
.chips { gap: 0.4rem; }
.chip { font: inherit; font-size: 0.8rem; font-weight: 600; padding: 0.35rem 0.75rem; border-radius: 999px; cursor: pointer; background: var(--surface-2); color: var(--t2); border: 1px solid var(--border); }
.chip:disabled { opacity: 0.4; cursor: default; }
.chip.sel { color: var(--t1); border-color: color-mix(in srgb, var(--c) 65%, transparent); background: color-mix(in srgb, var(--c) 18%, var(--surface-2)); box-shadow: 0 0 14px -6px var(--c); }
.chips .label { margin: 0 0.2rem 0 0; }
.label .chip { font-size: 0.62rem; padding: 0.1rem 0.5rem; letter-spacing: 0.06em; text-transform: none; margin-left: 0.2rem; }
/* lookup */
.lookup { flex: 1; min-width: 12rem; }
.lookup input { width: 100%; }
.sugg { margin-top: 0.4rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.sugg div { padding: 0.45rem 0.7rem; cursor: pointer; font-size: 0.86rem; display: flex; gap: 0.6rem; align-items: center; min-width: 0; }
.sugg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.sugg div:hover { background: color-mix(in srgb, var(--c) 14%, var(--surface-2)); }
.sugg .kind { width: 1.7rem; height: 1.7rem; border-radius: 4px; flex: none; display: grid; place-items: center; color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--surface-2)); font-size: 0.9rem; }
.sugg img { width: 1.7rem; height: 1.7rem; border-radius: 4px; object-fit: cover; flex: none; background: var(--bg); }
.sugg small { color: var(--t3); font-family: var(--mono); font-size: 0.66rem; margin-left: auto; white-space: nowrap; }

/* the pool: floating listener discs at the bottom */
.pool { position: fixed; left: 0; right: 0; bottom: 0; padding: 0.9rem 1rem calc(0.9rem + env(safe-area-inset-bottom)); pointer-events: none;
        background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--bg) 88%, transparent) 40%, var(--bg)); }
.pool-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; min-height: 3.4rem; pointer-events: auto; }
.pool .label { margin: 0 0.5rem 0 0; }
.av { --c: var(--amber); position: relative; width: 2.6rem; height: 2.6rem; border-radius: 50%; flex: none; animation: float 6s ease-in-out infinite;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 55%, transparent), 0 0 18px -2px color-mix(in srgb, var(--c) 55%, transparent); background: var(--surface-2); overflow: visible; }
.av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.av .ini { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-family: var(--disp); font-weight: 700; font-size: 0.95rem; color: var(--t1); background: color-mix(in srgb, var(--c) 30%, var(--surface-2)); }
.av .tip { position: absolute; bottom: calc(100% + 0.5rem); left: 50%; transform: translateX(-50%) translateY(4px); white-space: nowrap; font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.06em; color: var(--t1);
           background: var(--surface-2); border: 1px solid var(--border); padding: 0.25rem 0.55rem; border-radius: 7px; opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s; }
.av:hover .tip, .av:focus .tip { opacity: 1; transform: translateX(-50%) translateY(0); }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.av:nth-child(3n) { animation-delay: -2s; } .av:nth-child(3n+1) { animation-delay: -4s; } .av:nth-child(5n) { animation-duration: 7.5s; }
.av.me { --c: var(--rose); }
.pool .count { font-family: var(--mono); font-size: 0.66rem; color: var(--t3); align-self: center; margin-left: 0.3rem; }
.pool .credits { margin-left: auto; font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--t3); background: none; border: 0; cursor: pointer; padding: 0.3rem 0; }
.pool .credits:hover { color: var(--t1); }

/* view as: an admin previewing the page as a streamer or a listener */
.viewas { display: flex; gap: 0.3rem; justify-content: flex-end; margin-top: 0.35rem; }
.viewas .chip { font-size: 0.62rem; padding: 0.12rem 0.5rem; letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--mono); font-weight: 500; }

/* credits modal */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 1rem; background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(10px); }
.modal-card { --c: var(--amber); position: relative; width: min(560px, 100%); max-height: min(82vh, 720px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 17px; padding: 1.2rem 1.25rem 1.1rem;
              box-shadow: 0 30px 80px -30px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04); }
.modal-card h2 { font-family: var(--disp); font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 0.2rem; background: var(--grad-ember); -webkit-background-clip: text; background-clip: text; color: transparent; }
.modal-card .x { position: absolute; top: 0.8rem; right: 0.85rem; width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); color: var(--t2); font-size: 1.1rem; line-height: 1; cursor: pointer; }
.modal-card .x:hover { color: var(--t1); }
.modal-card .label { margin: 1rem 0 0.35rem; }
.modal-card ul { list-style: none; margin: 0; padding: 0; }
.modal-card li { display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 0.8rem; padding: 0.42rem 0; border-top: 1px solid var(--border); font-size: 0.9rem; }
.modal-card li:first-child { border-top: 0; }
.modal-card li a { color: var(--t1); text-decoration: none; font-weight: 600; }
.modal-card li a:hover { text-decoration: underline; }
.modal-card li .by { color: var(--t3); font-size: 0.78rem; grid-column: 1 / -1; }
.modal-card li .lic { font-family: var(--mono); font-size: 0.64rem; color: var(--t3); letter-spacing: 0.06em; align-self: center; white-space: nowrap; }
.modal-card .foot { color: var(--t3); font-size: 0.78rem; margin-top: 1rem; }

.hair { height: 2px; background: var(--grad-ember); border-radius: 2px; margin: 0 0 1.25rem; opacity: 0.8; }
@media (max-width: 420px) { .hero { grid-template-columns: 104px 1fr; } .disc { width: 104px; height: 104px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hair"></div>
  <header>
    <div><div class="eyebrow">radio on the tailnet</div><h1>Turntail</h1></div>
    <div><div class="me" id="me"></div>
      <div class="viewas" id="viewas" hidden><span class="me" style="align-self:center;white-space:nowrap">view as</span><button class="chip sel" data-view="admin">admin</button><button class="chip" data-view="streamer">streamer</button><button class="chip" data-view="listener">listener</button></div>
    </div>
  </header>

  <section class="card hero" id="hero">
    <div class="disc"><div class="sheen"></div></div>
    <div>
      <div class="label"><span class="dot" id="dot"></span><span id="livelabel">Nobody is on</span></div>
      <div class="big" id="livename">Drop a needle</div>
      <div class="now" id="title"></div>
      <img class="cover" id="cover" alt="" hidden>
      <div class="clock" id="clock"></div>
      <div class="playrow">
        <button class="play" id="play" aria-label="play" disabled>&#9654;</button>
        <div class="volwrap"><input class="vol" id="vol" type="range" min="0" max="1" step="0.02" value="0.9" aria-label="volume"><span class="volval" id="volval">90%</span></div>
      </div>
      <div class="err" id="playerr"></div>
      <audio id="player" preload="none"></audio>
    </div>
  </section>

  <section class="card" style="--c: var(--amber)">
    <div class="label">Stations</div>
    <div class="stations" id="stations"></div>
    <div class="label" style="margin-top:0.9rem">Up next</div>
    <ol class="queue" id="queue"><li class="muted">nobody waiting</li></ol>
  </section>

  <section class="card station" id="mine" hidden>
    <div class="label">Your station <span id="minename"></span> <button class="chip" id="rename" title="rename your station">rename</button></div>
    <div class="row" id="renamerow" hidden><input type="text" id="nameinput" maxlength="40" placeholder="Display name"><button class="b" id="savename">Save</button><button class="b" id="cancelname">Cancel</button></div>
    <div class="row">
      <button class="b primary" id="golive">Go live</button>
      <button class="b" id="leave">Stop</button>
    </div>

    <div class="row" id="titlerow" hidden>
      <div class="lookup"><input type="text" id="titleinput" placeholder="What is on the platter" maxlength="120" autocomplete="off"></div>
      <button class="b" id="settitle">Set</button>
    </div>
    <div class="sugg" id="sugg" hidden></div>
    <div class="row chips" id="wraprow" hidden><span class="label" style="margin:0">wrap up</span><button class="chip" data-wrap="0">end now</button><button class="chip" data-wrap="5">in 5 min</button><button class="chip" data-wrap="15">in 15</button><button class="chip" data-wrap="30">in 30</button></div>
    <div class="slot" id="slot"></div>
    <div class="err" id="mineerr"></div>
    <div class="muted" id="hint" style="font-size:0.8rem"></div>
  </section>

  <section class="card admin" id="admin" hidden>
    <div class="label">Admin</div>
    <div class="row chips"><span class="label">on the air</span><button class="chip" id="skip">Skip</button><button class="chip" id="extend">Extend slot</button></div>
    <div class="row chips"><span class="label">when nobody is on</span><button class="chip" id="houseon">Intermission</button><button class="chip" id="houseoff">Silence</button></div>
    <div class="row chips"><span class="label">latency test</span><button class="chip" id="clockbtn">Spoken clock</button></div>
    <div class="err" id="adminerr"></div>
  </section>

</div>

<div class="pool"><div class="pool-inner" id="pool"><div class="label">Listening</div><span class="muted" id="poolempty">nobody yet</span></div></div>

<div class="modal" id="creditsmodal" hidden role="dialog" aria-modal="true" aria-labelledby="creditstitle">
  <div class="modal-card">
    <button class="x" id="creditsclose" aria-label="close">&times;</button>
    <h2 id="creditstitle">Credits</h2>
    <div class="muted" style="font-size:0.85rem">Turntail is built on these.</div>
    <div id="creditsbody"><div class="muted" style="margin-top:1rem">loading</div></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const player = $("player"), play = $("play"), vol = $("vol");
  let st = null, wantPlay = false, retry = 0, mySel = null, skew = 0, wasLive = false;
  const nowSrv = () => Date.now() + skew;
  const mmss = ms => { const t = Math.max(0, Math.round(ms / 1000)); const m = Math.floor(t / 60), sec = t % 60; return m + ":" + String(sec).padStart(2, "0"); };

  const fmtLeft = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m === 0 ? "under a minute" : m + " min"; };
  const initials = n => (n || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

  function avatar(p, me) {
    const a = document.createElement("div"); a.className = "av" + (me ? " me" : ""); a.tabIndex = 0;
    if (p.pic) { const i = document.createElement("img"); i.src = "/api/cover?u=" + encodeURIComponent(p.pic); i.alt = ""; i.onerror = () => { i.replaceWith(ini()); }; a.appendChild(i); } else a.appendChild(ini());
    function ini() { const d = document.createElement("div"); d.className = "ini"; d.textContent = initials(p.name || p.login); return d; }
    const t = document.createElement("span"); t.className = "tip"; t.textContent = p.name || p.login; a.appendChild(t);
    return a;
  }

  let current = player, spare = document.createElement("audio"); spare.preload = "none"; document.body.appendChild(spare);
  let currentSrc = null, switching = false;
  const wantSrc = () => { const playable = st && (st.live || (st.house && st.house.playing)); if (!playable) return null; return "/stream/live?m=" + encodeURIComponent(st.live ? st.live.mount : "house"); };
  function applyVol() { current.volume = Number(vol.value); spare.volume = Number(vol.value); }
  function attach() {
    const want = wantSrc();
    if (!want) { currentSrc = null; current.pause(); current.removeAttribute("src"); current.load(); return false; }
    if (want === currentSrc) return true;
    if (!wantPlay) { currentSrc = want; current.src = want; current.load(); return true; }
    if (switching) return true;
    switching = true;
    const next = spare; next.src = want; next.load();
    const go = () => { next.removeEventListener("canplay", go); next.play().then(() => {
      const old = current; current = next; spare = old; currentSrc = want; switching = false; wire(current);
      setTimeout(() => { old.pause(); old.removeAttribute("src"); old.load(); }, 150); setPlayUI(); retry = 0; $("playerr").textContent = ""; $("playerr").style.color = "";
    }).catch(() => { switching = false; play.classList.add("nudge"); $("playerr").textContent = "tap play to listen"; $("playerr").style.color = "var(--amber)"; }); };
    next.addEventListener("canplay", go);
    setTimeout(() => { if (switching) { next.removeEventListener("canplay", go); switching = false; } }, 8000);
    return true;
  }
  async function startPlay() { wantPlay = true; try { localStorage.setItem("turntail.play", "1"); } catch {} const want = wantSrc(); if (!want) return; if (current.getAttribute("src") !== want || current.error) { current.src = want; current.load(); currentSrc = want; } applyVol(); try { await current.play(); retry = 0; $("playerr").textContent = ""; } catch (e) { $("playerr").textContent = "could not start: " + e.message; } }
  function stopPlay() { wantPlay = false; try { localStorage.setItem("turntail.play", "0"); } catch {} current.pause(); current.removeAttribute("src"); current.load(); currentSrc = null; setPlayUI(); }
  function setPlayUI() { const on = wantPlay && !current.paused; play.classList.toggle("playing", on); play.classList.toggle("waiting", wantPlay && current.paused); play.innerHTML = on ? "&#10074;&#10074;" : "&#9654;"; }
  play.onclick = () => wantPlay ? stopPlay() : startPlay();
  const setVol = () => { applyVol(); $("volval").textContent = Math.round(vol.value * 100) + "%"; try { localStorage.setItem("turntail.vol", vol.value); } catch {} };
  try { const v = localStorage.getItem("turntail.vol"); if (v !== null) vol.value = v; } catch {}
  vol.oninput = setVol; setVol();
  const reconnect = why => { if (!wantPlay || !wantSrc()) return; retry++; const wait = Math.min(15000, 500 * Math.pow(2, retry - 1));
    $("playerr").textContent = "stream hiccup (" + why + "), reconnecting in " + (wait / 1000).toFixed(1) + "s";
    setTimeout(() => { if (!wantPlay) return; currentSrc = null; startPlay(); }, wait); };
  function wire(el) { if (el.__wired) return; el.__wired = true; el.addEventListener("play", setPlayUI); el.addEventListener("pause", setPlayUI);
    ["stalled", "error", "ended"].forEach(ev => el.addEventListener(ev, () => { if (el === current) reconnect(ev); })); }
  wire(current); wire(spare);

  function render() {
    { const b = document.createElement("b"); b.textContent = st.me.name || st.me.login;
      $("me").replaceChildren("you are ", b, realAdmin && viewAs !== "admin" ? " · viewing as " + viewAs : st.me.admin ? " · admin" : st.me.mounts.length ? " · streamer" : ""); }
    const stationOf = m => st.stations.find(s => s.mount === m) || (m === st.clock.mount ? { name: "Spoken clock" } : m === st.house.mount ? { name: "Intermission" } : null);
    const live = st.live;
    const house = st.house && st.house.playing;
    $("hero").classList.toggle("on", !!live);
    $("hero").classList.toggle("house", !live && house);
    $("dot").className = "dot" + (live ? " on" : "");
    if (live) {
      const s = stationOf(live.mount);
      $("livelabel").textContent = "On the air";
      $("livename").textContent = s ? s.name : live.mount;
      $("title").textContent = live.title || "";
      const cv = $("cover"); if (live.cover) { const u = "/api/cover?u=" + encodeURIComponent(live.cover); if (cv.getAttribute("src") !== u) cv.src = u; cv.hidden = false; } else cv.hidden = true;
      $("clock").textContent = clockText(live);
      play.disabled = false;
      if (wantPlay) attach();
    } else if (house) {
      $("livelabel").textContent = "Between records"; $("livename").textContent = "Intermission"; $("title").textContent = "music between records"; $("clock").textContent = ""; $("cover").hidden = true;
      play.disabled = false;
      if (wantPlay) attach();
    } else {
      $("livelabel").textContent = "Nobody is on"; $("livename").textContent = "Drop a needle"; $("title").textContent = ""; $("clock").textContent = ""; $("cover").hidden = true;
      play.disabled = true;
      if (wantPlay) { current.pause(); current.removeAttribute("src"); current.load(); currentSrc = null; setPlayUI(); $("playerr").textContent = "nothing on right now, will resume when something starts"; $("playerr").style.color = "var(--t3)"; }
    }

    const S = $("stations"); S.replaceChildren();
    st.stations.forEach(s => { const d = document.createElement("div"); const isLive = live && live.mount === s.mount;
      d.className = "st" + (isLive ? " on" : s.source ? " src" : "");
      d.innerHTML = '<div class="txt"><div class="n"></div><div class="s"></div></div>';
      if (s.avatar) { const i = document.createElement("img"); i.className = "stav"; i.src = "/api/cover?u=" + encodeURIComponent(s.avatar); i.alt = ""; i.onerror = () => i.remove(); d.prepend(i); }
      d.querySelector(".n").textContent = s.name;
      d.querySelector(".s").textContent = isLive ? "on the air" : s.source ? "source connected" : "quiet";
      if (s.mine) d.classList.add("sel");
      S.appendChild(d); });

    const Q = $("queue"); Q.replaceChildren();
    if (st.queue.length) st.queue.forEach(q => { const li = document.createElement("li"); const s = stationOf(q.mount); li.textContent = s ? s.name : q.mount; Q.appendChild(li); });
    else { const li = document.createElement("li"); li.className = "muted"; li.textContent = "nobody waiting"; Q.appendChild(li); }

    const mine = st.stations.filter(s => s.mine);
    $("mine").hidden = mine.length === 0;
    if (mine.length) {
      if (!mySel || !mine.some(s => s.mount === mySel)) mySel = mine[0].mount;
      { const nm = (mine.find(s => s.mount === mySel) || mine[0]).name; $("minename").textContent = nm && nm !== (st.me.name || st.me.login) ? "· " + nm : ""; }
      const amLive = live && mine.some(s => s.mount === live.mount);
      const queued = st.queue.some(q => mine.some(s => s.mount === q.mount));
      const selName = (mine.find(s => s.mount === mySel) || mine[0]).name;
      const selSrc = (mine.find(s => s.mount === mySel) || mine[0]).source;
      $("golive").disabled = amLive || queued || !selSrc;
      $("golive").textContent = amLive ? "You are on the air" : queued ? "You are in the queue" : live ? "Ask for the next slot" : "Go live";
      $("hint").textContent = (!amLive && !queued && !selSrc) ? selName + " has no source connected yet. Check the station on its Pi." : "";
      $("leave").disabled = !amLive && !queued; $("leave").textContent = amLive ? "Stop streaming" : "Leave the queue";
      $("titlerow").hidden = !amLive; $("wraprow").hidden = !amLive;
      if (!amLive) warned = 0;
      $("mine").classList.toggle("onair", !!amLive);
      if (amLive && !wasLive) { $("mine").classList.remove("justlive"); void $("mine").offsetWidth; $("mine").classList.add("justlive"); document.title = "● On the air · Turntail"; try { if (Notification.permission === "granted") new Notification("Turntail", { body: "You are on the air" }); } catch {} }
      if (!amLive) document.title = "Turntail";
      wasLive = !!amLive;
    }
    $("admin").hidden = !st.me.admin; $("skip").disabled = !live; $("extend").disabled = !live;
    $("houseon").classList.toggle("sel", st.house.enabled); $("houseoff").classList.toggle("sel", !st.house.enabled); $("houseon").disabled = !st.house.source;
    $("clockbtn").classList.toggle("sel", st.clock.live); $("clockbtn").textContent = st.clock.live ? "Spoken clock is on the air" : "Spoken clock"; $("clockbtn").disabled = !st.clock.source || (!!live && !st.clock.live);

    const P = $("pool"); const keep = P.querySelector(".label"); P.replaceChildren(keep);
    if (st.listeners.length) { st.listeners.slice(0, 40).forEach(p => P.appendChild(avatar(p, p.login === st.me.login)));
      if (st.listeners.length > 40) { const c = document.createElement("span"); c.className = "count"; c.textContent = "+" + (st.listeners.length - 40); P.appendChild(c); }
      const c = document.createElement("span"); c.className = "count"; c.textContent = st.listeners.length + (st.listeners.length === 1 ? " listener" : " listeners"); P.appendChild(c); }
    else { const e = document.createElement("span"); e.className = "muted"; e.textContent = "nobody yet"; P.appendChild(e); }
    const cl = document.createElement("button"); cl.className = "credits"; cl.textContent = "credits"; cl.onclick = openCredits; P.appendChild(cl);
    $("viewas").hidden = !realAdmin;
    $("viewas").querySelectorAll(".chip").forEach(b => b.classList.toggle("sel", b.dataset.view === viewAs));
  }

  let viewAs = "admin", realAdmin = false;
  function applyView() {
    if (!st) return;
    realAdmin = realAdmin || !!st.me.admin;
    if (!realAdmin || viewAs === "admin") return;
    st.me = { ...st.me, admin: false, mounts: viewAs === "streamer" ? st.me.mounts : [] };
    st.stations = st.stations.map(s => ({ ...s, mine: st.me.mounts.includes(s.mount) }));
  }
  $("viewas").querySelectorAll(".chip").forEach(b => b.onclick = () => { viewAs = b.dataset.view; refresh(); });

  let creditsLoaded = false;
  async function openCredits() {
    $("creditsmodal").hidden = false;
    if (creditsLoaded) return;
    try {
      const c = await (await fetch("/api/credits", { cache: "no-store" })).json();
      const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
      const link = (name, url) => /^https?:\/\//i.test(url || "") ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(name) + '</a>' : "<b>" + esc(name) + "</b>";
      const list = (items, f) => "<ul>" + items.map(f).join("") + "</ul>";
      const row = x => "<li>" + link(x.name, x.url) + '<span class="lic">' + esc(x.license || "") + '</span><span class="by">' + esc([x.by, x.role].filter(Boolean).join(" · ")) + "</span></li>";
      let h = '<div class="label">Software</div>' + list(c.software, row);
      h += '<div class="label">Record and song data</div>' + list(c.data, x => "<li>" + link(x.name, x.url) + '<span class="lic"></span><span class="by">' + esc(x.role) + " · " + esc(x.note) + "</span></li>");
      h += '<div class="label">Between records</div>';
      h += c.music.length ? list(c.music, m => "<li>" + link(m.title, m.url) + '<span class="lic">' + esc(m.license || "") + '</span><span class="by">' + esc(m.artist ? m.artist + " · " : "") + esc(m.source || "") + "</span></li>")
                          : '<div class="muted">no intermission music loaded</div>';
      h += '<div class="label">Type</div>' + list(c.fonts || [], row);
      $("creditsbody").innerHTML = h; creditsLoaded = true;
    } catch (e) { $("creditsbody").innerHTML = '<div class="err">could not load credits</div>'; }
  }
  const closeCredits = () => { $("creditsmodal").hidden = true; };
  $("creditsclose").onclick = closeCredits;
  $("creditsmodal").addEventListener("click", e => { if (e.target === $("creditsmodal")) closeCredits(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeCredits(); });

  function clockText(live) {
    if (!live.until) return "open ended, nobody waiting";
    const left = live.until - nowSrv();
    if (left > 0) return (live.endBy === "wrap" ? "wrapping up · " : "someone is waiting · ") + mmss(left) + " left";
    return "time is up · " + mmss(Math.max(0, live.until + st.graceMs - nowSrv())) + " of grace for the last track";
  }
  let warned = 0; // 1 after the five-minute warning, 2 after the time-is-up flash, reset when off the air
  function nudgeMine(text, body) {
    $("mine").classList.remove("justlive"); void $("mine").offsetWidth; $("mine").classList.add("justlive");
    document.title = text + " · Turntail";
    try { if (Notification.permission === "granted") new Notification(text, { body }); } catch {}
  }
  function tick() { if (!st) return; const live = st.live; if (live) $("clock").textContent = clockText(live);
    const mine = st.stations.filter(s => s.mine); if (!mine.length) return;
    const amLive = live && mine.some(s => s.mount === live.mount); const pos = st.queue.findIndex(q => mine.some(s => s.mount === q.mount));
    if (amLive) {
      const onFor = Math.max(0, Math.round((nowSrv() - live.since) / 60000));
      const next = stationName(st.queue[0] && st.queue[0].mount) || "the next station";
      const left = live.until != null ? live.until - nowSrv() : null;
      let t = "You are on the air, " + onFor + " min so far";
      if (left == null) t += ", open ended";
      else if (left > 0) t += " · " + mmss(left) + " left" + (live.endBy === "wrap" ? ", you chose to wrap up" : ", then " + next + " is up");
      else t += " · time is up, " + mmss(Math.max(0, live.until + st.graceMs - nowSrv())) + " of grace, then " + next;
      $("slot").textContent = t;
      if (left != null && left <= st.warnMs && left > 0 && warned < 1) { warned = 1; nudgeMine(Math.round(st.warnMs / 60000) + " minutes left", next + " is up next. Pick a last track."); }
      if (left != null && left <= 0 && warned < 2) { warned = 2; nudgeMine("Time is up", Math.round(st.graceMs / 60000) + " minutes of grace, then " + next + " goes on."); }
    }
    else if (pos >= 0) { const ahead = pos; const cur = live && live.until ? Math.max(0, live.until - nowSrv()) : 0; const est = cur + ahead * st.slotMinutes * 60000; $("slot").textContent = "You are number " + (pos + 1) + " in line · up in about " + Math.max(1, Math.round(est / 60000)) + " min"; }
    else $("slot").textContent = ""; }
  setInterval(tick, 1000);
  const stationName = m => { const s = m && st.stations.find(x => x.mount === m); return s ? s.name : m === (st.clock && st.clock.mount) ? "Spoken clock" : ""; };
  async function refresh() { try { const r = await fetch("/api/state", { cache: "no-store" }); if (!r.ok) throw new Error(r.status); st = await r.json(); skew = st.now - Date.now(); applyView(); render(); tick(); } catch (e) { $("playerr").textContent = "cannot reach the hub (" + e.message + ")"; } }
  async function post(path, body, errEl) { try { const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); $(errEl).textContent = ""; } catch (e) { $(errEl).textContent = e.message; } refresh(); }
  $("golive").onclick = () => { try { if (Notification.permission === "default") Notification.requestPermission(); } catch {} post("/api/golive", { mount: mySel }, "mineerr"); };
  $("leave").onclick = () => post("/api/leave", {}, "mineerr");
  $("wraprow").querySelectorAll(".chip").forEach(b => b.onclick = () => post("/api/wrap", { minutes: Number(b.dataset.wrap) }, "mineerr"));
  $("rename").onclick = () => { const mine = st.stations.find(s => s.mount === mySel); $("nameinput").value = mine ? mine.name : ""; $("renamerow").hidden = false; $("nameinput").focus(); };
  $("cancelname").onclick = () => { $("renamerow").hidden = true; };
  $("savename").onclick = () => { $("renamerow").hidden = true; post("/api/station", { mount: mySel, name: $("nameinput").value }, "mineerr"); };
  $("nameinput").addEventListener("keydown", e => { if (e.key === "Enter") $("savename").onclick(); if (e.key === "Escape") $("cancelname").onclick(); });
  let pickedCover = "";
  $("settitle").onclick = () => post("/api/title", { title: $("titleinput").value, cover: pickedCover }, "mineerr");
  $("skip").onclick = () => post("/api/admin/skip", {}, "adminerr");
  $("extend").onclick = () => post("/api/admin/extend", {}, "adminerr");
  $("houseon").onclick = () => post("/api/admin/house", { enabled: true }, "adminerr");
  $("houseoff").onclick = () => post("/api/admin/house", { enabled: false }, "adminerr");
  $("clockbtn").onclick = () => post("/api/admin/clock", { enabled: !st.clock.live }, "adminerr");
  const ti = $("titleinput"), sg = $("sugg"); let lt = null, lastQ = "";
  ti.addEventListener("input", () => { clearTimeout(lt); const q = ti.value.trim(); if (q.length < 3) { sg.hidden = true; return; }
    lt = setTimeout(async () => { if (q === lastQ) return; lastQ = q; try { const r = await fetch("/api/lookup?q=" + encodeURIComponent(q)); const j = await r.json(); sg.replaceChildren();
      (j.results || []).slice(0, 8).forEach(x => { const d = document.createElement("div"); if (x.thumb) { const i = document.createElement("img"); i.src = "/api/cover?u=" + encodeURIComponent(x.thumb); i.alt = ""; d.appendChild(i); } else { const k = document.createElement("span"); k.className = "kind"; k.textContent = "♪"; d.appendChild(k); }
        const t = document.createElement("span"); t.textContent = x.title; d.appendChild(t); const m = document.createElement("small"); m.textContent = [x.year, x.format].filter(Boolean).join(" · "); d.appendChild(m);
        d.onclick = () => { ti.value = x.title; pickedCover = x.thumb || ""; sg.hidden = true; post("/api/title", { title: x.title, cover: pickedCover }, "mineerr"); }; sg.appendChild(d); });
      sg.hidden = sg.children.length === 0; } catch { sg.hidden = true; } }, 350); });
  ti.addEventListener("keydown", e => { if (e.key === "Enter") { sg.hidden = true; pickedCover = ""; post("/api/title", { title: ti.value, cover: "" }, "mineerr"); } if (e.key === "Escape") sg.hidden = true; });
  document.addEventListener("click", e => { if (!e.target.closest(".lookup") && !e.target.closest(".sugg")) sg.hidden = true; });

  let autoTried = false;
  async function autoplay() { if (autoTried || !st) return; autoTried = true; let want = false; try { want = localStorage.getItem("turntail.play") !== "0"; } catch {} if (!want) return;
    if (!wantSrc()) { wantPlay = true; setPlayUI(); $("playerr").textContent = "nothing on right now, will play when something starts"; $("playerr").style.color = "var(--t3)"; return; }
    wantPlay = true; const src = wantSrc(); current.src = src; current.load(); currentSrc = src; applyVol();
    try { await current.play(); setPlayUI(); } catch (e) { wantPlay = false; setPlayUI(); play.classList.add("nudge"); $("playerr").textContent = "tap play to listen"; $("playerr").style.color = "var(--amber)"; } }
  play.addEventListener("click", () => { play.classList.remove("nudge"); $("playerr").style.color = ""; });
  refresh().then(autoplay); setInterval(refresh, 4000);
})();
</script>
</body>
</html>
